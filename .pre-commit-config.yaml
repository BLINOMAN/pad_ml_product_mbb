repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff linter
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff formatter
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy typechecker
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false