[project]
name = "pad-ml-product-mbb"
version = "0.1.0"
description = "Домашка №1"
readme = "README.md"
authors = [
    { name = "Boris", email = "sanyko724@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pad-ml-product-mbb = "pad_ml_product_mbb:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.3.0",       # Линтер и форматтер (замена flake8/black)
    "mypy>=1.10.0",     # Тайпчекер
    "pre-commit>=3.7.0", # Менеджер git-хуков
]

[tool.ruff]
line-length = 99

lint.select = [
    "E",
    "W",
    "B",
    "UP",
    "I",
    "SIM"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.mypy]
strict = true

exclude = [
    '(^|/)\.venv/',
    '(^|/)\.git/',
    '(^|/)__pycache__/',
    '(^|/)\.mypy_cache/',
    '(^|/)\.ruff_cache/',
]

ignore_missing_imports = true